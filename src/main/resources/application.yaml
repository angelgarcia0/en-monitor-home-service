spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: home-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    # Only the home changesets. The schema is shared with energy-monitor-backend and the security,
    # device and measurement services (ADR-003), and so is the DATABASECHANGELOG table: each
    # service applies its own changelogs.
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Message broker (RabbitMQ, from infra): the home events this service announces, and the account
  # events it consumes. Each consumer declares and binds its own queue.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:energy-monitor}
    password: ${RABBITMQ_PASSWORD:}
    # A home message is marked as published only after the broker confirms it and a queue took it
    # (correlated: the return of an unrouted message is known before the confirmation completes).
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  # 8080 is the API gateway, 8082 the security service, 8083 energy-monitor-backend, 8084 the
  # device service and 8085 the measurement service when all run on the same machine.
  port: ${SERVER_PORT:8086}
  # The web and mobile requests come through the API gateway: from it (loopback or a Docker
  # network) the container takes the caller's address and scheme from X-Forwarded-For and
  # X-Forwarded-Proto. A call from outside relayed with a forwarded address therefore counts as
  # that address, and the internal API refuses it.
  forward-headers-strategy: native
  tomcat:
    # Only loopback (the gateway or nginx on this machine) and the Docker networks may set it: the
    # default would trust every private network, and a machine of the LAN could then pass as
    # 127.0.0.1.
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

security:
  jwt:
    # The access tokens are issued by the security service; this service only validates them, with
    # the service's public key and its iss claim (the value the monolith used, kept unchanged).
    issuer: https://energy-monitor-backend
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

# Calls between this service and the others, both ways: the names of the users of a home come from
# the security service (no answer within the timeouts lists the members without names), and the
# other services ask /internal/homes/** and /internal/accounts/**. Inbound calls must come from
# allowed-networks and carry the token; the reverse proxy never forwards /internal/**.
internal-api:
  # Same value in every service. Empty refuses every inbound internal call.
  # Generate with: openssl rand -hex 32
  token: ${INTERNAL_API_TOKEN:}
  allowed-networks: ${INTERNAL_API_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}
  security-service-url: ${SECURITY_SERVICE_URL:http://localhost:8082}
  connect-timeout: PT1S
  read-timeout: PT2S

messaging:
  # Topic exchange the security service publishes to (account.deleted), and the dead-letter
  # exchange of the queues this service consumes.
  security-exchange: energy-monitor.security
  dead-letter-exchange: home-service.dlx
  # Both off until energy-monitor-backend stops serving the homes: it consumes account.deleted
  # from a queue of its own and relays the home_outbox table this service shares with it, so
  # turning these on earlier would handle every message twice. infra switches them on together
  # with the gateway route.
  account-deleted:
    enabled: ${ACCOUNT_DELETED_CONSUMER_ENABLED:false}
  # Topic exchange of the home events this service announces (home.deleted), written to the
  # home_outbox table with the change and relayed every second, up to 50 messages, each confirmed
  # by the broker within 5 s.
  home:
    exchange: energy-monitor.home
    relay-enabled: ${HOME_OUTBOX_RELAY_ENABLED:false}
    poll-interval: PT1S
    batch-size: 50
    confirm-timeout: PT5S

# Consumption limits a home starts with, in kWh.
home:
  defaults:
    daily-limit: 6.0
    monthly-limit: 180.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
